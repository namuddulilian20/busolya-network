# Busolya network — static sites + API + database on Render.
# One repo, one blueprint. A push to the connected branch redeploys the
# services whose files changed.
#
# IMPORTANT: after changing render.yaml, sync the blueprint in the Render
# dashboard (Settings > Blueprint > Sync) so existing services pick up
# the new config. New services are created automatically.

databases:
  - name: busolya-db
    databaseName: busolya
    user: busolya
    plan: free
    region: frankfurt

services:
  # ---- backend ----
  - type: web
    name: busolya-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: busolya-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

  # ---- public sites (plain HTML — multi-page, no SPA rewrite needed) ----
  # No buildCommand: Render serves the files directly from staticPublishPath.
  # No routes rewrite: every page is a real .html file; rewriting /* to
  #   /index.html would break all other pages (register.html, login.html,
  #   product.html, stall.html, etc.).

  - type: web
    name: busolya-agro-farmers
    runtime: static
    staticPublishPath: ./sites/baf
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: bataka-agro-expo
    runtime: static
    staticPublishPath: ./sites/bae
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: abataka-mutindo-sacco
    runtime: static
    staticPublishPath: ./sites/mutindo
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
