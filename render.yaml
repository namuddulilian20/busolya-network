# Busolya network — static sites + API + database on Render.
# One repo, one blueprint. A push to the connected branch redeploys the
# services whose files changed.
#
# IMPORTANT: after changing render.yaml, sync the blueprint in the Render
# dashboard (Settings > Blueprint > Sync) so existing services pick up
# the new config. New services are created automatically.

databases:
  - name: busolya-db
    databaseName: busolya
    user: busolya
    plan: free
    region: frankfurt

services:
  # ---- backend ----
  - type: web
    name: busolya-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: busolya-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # ---- media storage (durable options; see docs/media-storage.md) ----
      # Plain vars: leave value empty to keep the code defaults, which means
      # ephemeral local disk (media is still lost on every redeploy). Set a
      # value here OR in the Render dashboard to enable a durable option.
      - key: MEDIA_STORAGE_PATH
        value: ""
      - key: MEDIA_BASE_URL
        value: ""
      - key: MEDIA_MAX_MB
        value: ""
      - key: MEDIA_S3_BUCKET
        value: "busolya"
      - key: MEDIA_S3_REGION
        value: "auto"
      - key: MEDIA_S3_ENDPOINT
        value: "https://05558010b9f3ed699dc244a3a3117636.r2.cloudflarestorage.com"
      # Public URL the browser loads media from. Enable public access on the
      # R2 bucket (Cloudflare dashboard > R2 > busolya > Settings > Public
      # access) and paste the resulting URL here, e.g. https://pub-xxx.r2.dev
      - key: MEDIA_S3_PUBLIC_BASE_URL
        value: "https://pub-606b0f048b2b44009055f593c870c1ed.r2.dev"
      # Secrets: enter these in the Render dashboard. sync: false keeps a
      # blueprint Sync from overwriting the values you type in manually.
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      # Keep the free-tier service warm to prevent spin-down DNS errors.
      # Remove or set to false when upgrading to a paid plan.
      - key: KEEP_ALIVE
        value: "true"
      # ---- auth: superuser + optional SMS one-time codes ----
      # The registered account with this phone is promoted to superuser on boot.
      - key: SUPERUSER_PHONE
        value: "+256780698353"
      - key: OTP_TTL_MINUTES
        value: "10"
      # Leave both blank to keep the last-5-digits phone verification.
      # Set SMS_PROVIDER_URL to an HTTP endpoint that accepts
      # { "to": "...", "message": "..." }; the key goes in the dashboard.
      - key: SMS_PROVIDER_URL
        value: ""
      - key: SMS_API_KEY
        sync: false

  # ---- public sites (plain HTML — multi-page, no SPA rewrite needed) ----
  # No buildCommand: Render serves the files directly from staticPublishPath.
  # No routes rewrite: every page is a real .html file; rewriting /* to
  #   /index.html would break all other pages (register.html, login.html,
  #   product.html, stall.html, etc.).

  - type: web
    name: busolya-agro-farmers
    runtime: static
    staticPublishPath: ./sites/baf
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: bataka-agro-expo
    runtime: static
    staticPublishPath: ./sites/bae
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: abataka-mutindo-sacco
    runtime: static
    staticPublishPath: ./sites/mutindo
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
