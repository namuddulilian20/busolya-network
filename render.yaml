# Busolya network — static sites + API + database on Render.
# One repo, one blueprint. A push to the connected branch redeploys the
# services whose files changed.

databases:
  - name: busolya-db
    databaseName: busolya
    user: busolya
    plan: free
    region: frankfurt

services:
  # ---- backend: demand log, supply log, linkages, directory, education ----
  - type: web
    name: busolya-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: busolya-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

  # ---- public sites (plain HTML — no build step required) ----
  # buildCommand uses "echo ok" as a no-op so Render's build pipeline succeeds.
  # The routes rewrite block serves index.html for any path that has no matching
  # file, so direct URL hits and reloads work correctly.

  - type: web
    name: busolya-agro-farmers
    runtime: static
    buildCommand: echo ok
    staticPublishPath: ./sites/baf
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: bataka-agro-expo
    runtime: static
    buildCommand: echo ok
    staticPublishPath: ./sites/bae
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: abataka-mutindo-sacco
    runtime: static
    buildCommand: echo ok
    staticPublishPath: ./sites/mutindo
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
