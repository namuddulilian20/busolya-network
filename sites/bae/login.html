<!DOCTYPE html>
<html lang="en" data-site="bae">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Busolya Agro Farmers Ltd</title>
<meta name="description" content="Sign in to Busolya Agro Farmers — suppliers, members, employees and customers.">
<link rel="icon" href="assets/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    bark:'#4a2311', cream:'#fbf6ec', paper:'#fffdf8',
    leaf:'#2f7d32', leafdark:'#1f5523', seal:'#a8321e', ink:'#2a1a10'
  }, fontFamily: { display:['Georgia','Times New Roman','serif'], body:['Segoe UI','system-ui','sans-serif'] } } }
}
</script>
<style type="text/tailwindcss">
  @layer base { body { @apply bg-cream text-ink font-body antialiased; } }
</style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="mx-auto max-w-md px-5 py-12">
  <div class="rounded-2xl border border-[#e2d6c2] bg-paper p-8 shadow-lg">
    <div class="mb-7 text-center">
      <img src="assets/mark.svg" alt="" class="mx-auto mb-4 h-16 w-16 rounded-full ring-2 ring-bark">
      <h1 class="font-display text-2xl font-bold text-bark">Sign in</h1>
      <p class="mt-1 text-sm text-ink/60">Supplier · Member · Employee · Customer</p>
    </div>

    <form id="loginForm" novalidate class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-semibold text-bark">Phone number or email</label>
        <input id="loginId" type="text" required autocomplete="username"
          class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
          placeholder="+256 700 000 000 or email@example.com">
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold text-bark">Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password"
          class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
          placeholder="••••••••">
      </div>
      <button type="submit"
        class="w-full rounded-full bg-leaf px-5 py-3 text-sm font-bold text-white hover:bg-leafdark transition">
        Sign in
      </button>
    </form>

    <div id="loginMsg" class="mt-3 hidden rounded-lg px-4 py-3 text-sm"></div>

    <p class="mt-5 border-t border-[#e2d6c2] pt-4 text-center text-sm text-ink/55">
      No account? <a href="register.html" class="font-medium text-leafdark hover:underline">Register here</a>
    </p>
    <p class="mt-2 text-center text-sm text-ink/55">
      Supplier? <a href="supplier-login.html" class="font-medium text-leafdark hover:underline">Supplier portal login</a>
    </p>
  </div>
</main>

<div id="footer-placeholder"></div>
<script src="assets/network.js"></script>
<script src="../shared/components.js"></script>
<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
    ? '' : 'https://busolya-api.onrender.com';

  var form = document.getElementById('loginForm');
  var msg  = document.getElementById('loginMsg');

  function showMsg(text, type) {
    msg.className = 'mt-3 rounded-lg px-4 py-3 text-sm ' +
      (type === 'ok'  ? 'bg-[#e6efe0] text-leafdark border border-leaf/30' :
       type === 'err' ? 'bg-[#fbe9e7] text-seal border border-seal/30' : 'hidden');
    msg.textContent = text;
    msg.classList.remove('hidden');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var loginId = document.getElementById('loginId').value.trim();
    var password = document.getElementById('loginPassword').value;
    if (!loginId || !password) { showMsg('Please fill in all fields.', 'err'); return; }

    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ login_id: loginId, password: password })
    })
    .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
    .then(function (r) {
      if (!r.ok) { showMsg(r.data.error || 'Invalid credentials.', 'err'); return; }
      window.BusolyaAuth.login({
        id:    r.data.id,
        phone: r.data.phone,
        name:  r.data.name || loginId,
        role:  r.data.role
      });
    })
    .catch(function () {
      showMsg('Could not reach the server. Check your connection.', 'err');
    });
  });
})();
</script>
</body>
</html>
