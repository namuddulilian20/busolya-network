<!DOCTYPE html>
<html lang="en" data-site="bae">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Busolya Agro Farmers Ltd</title>
<meta name="description" content="Sign in to Busolya Agro Farmers — exhibitors, members, employees and customers.">
<link rel="icon" href="assets/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    bark:'#4a2311', cream:'#fbf6ec', paper:'#fffdf8',
    leaf:'#2f7d32', leafdark:'#1f5523', seal:'#a8321e', ink:'#2a1a10'
  }, fontFamily: { display:['Georgia','Times New Roman','serif'], body:['Segoe UI','system-ui','sans-serif'] } } }
}
</script>
<style type="text/tailwindcss">
  @layer base { body { @apply bg-cream text-ink font-body antialiased; } }
</style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="mx-auto max-w-md px-5 py-12">
  <div class="rounded-2xl border border-[#e2d6c2] bg-paper p-8 shadow-lg">
    <div class="mb-7 text-center">
      <img src="assets/mark.svg" alt="" class="mx-auto mb-4 h-16 w-16 rounded-full ring-2 ring-bark">
      <h1 class="font-display text-2xl font-bold text-bark">Sign in</h1>
      <p class="mt-1 text-sm text-ink/60">Exhibitor · Member · Employee · Customer</p>
    </div>

    <!-- Phone verification note -->
    <div class="mb-4 rounded-lg border border-leaf/25 bg-[#f2f8ef] px-4 py-3 text-xs text-leafdark">
      No passwords here. Sign in with your phone number — we'll ask you to confirm the last 5 digits of the number on this account.
    </div>

    <form id="loginForm" novalidate class="space-y-4">
      <!-- Step 1: phone number -->
      <div id="stepPhone">
        <div>
          <label class="mb-1 block text-sm font-semibold text-bark">Phone number or email</label>
          <input id="loginId" type="text" required autocomplete="username"
            class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
            placeholder="+256 700 000 000 or email@example.com">
        </div>
      </div>
      <!-- Step 2: confirm the last 5 digits -->
      <div id="stepVerify" class="hidden">
        <p class="text-sm text-ink/70">Account <span id="maskedPhone" class="font-semibold text-bark"></span></p>
        <label class="mt-2 mb-1 block text-sm font-semibold text-bark">Last 5 digits of your phone number</label>
        <input id="last5" type="text" inputmode="numeric" maxlength="5" autocomplete="off"
          class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark tracking-[.4em] focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
          placeholder="•••••">
        <button type="button" id="backToPhone"
          class="mt-2 text-xs font-semibold text-ink/50 hover:text-bark">← use a different number</button>
      </div>
      <button type="submit" id="loginBtn"
        class="w-full rounded-full bg-leaf px-5 py-3 text-sm font-bold text-white hover:bg-leafdark transition">
        Sign in
      </button>
    </form>

    <div id="loginMsg" class="mt-3 hidden rounded-lg px-4 py-3 text-sm"></div>

    <p class="mt-5 border-t border-[#e2d6c2] pt-4 text-center text-sm text-ink/55">
      No account? <a href="register.html" class="font-medium text-leafdark hover:underline">Register here</a>
    </p>
    <p class="mt-2 text-center text-sm text-ink/55">
      Exhibitor? <a href="exhibitor-login.html" class="font-medium text-leafdark hover:underline">Exhibitor portal login</a>
    </p>
  </div>
</main>

<div id="footer-placeholder"></div>
<script src="assets/network.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
    ? '' : 'https://busolya-api.onrender.com';

  var form = document.getElementById('loginForm');
  var msg  = document.getElementById('loginMsg');
  var step1   = document.getElementById('stepPhone');
  var step2   = document.getElementById('stepVerify');
  var btn     = document.getElementById('loginBtn');

  function showMsg(text, type) {
    msg.className = 'mt-3 rounded-lg px-4 py-3 text-sm ' +
      (type === 'ok'  ? 'bg-[#e6efe0] text-leafdark border border-leaf/30' :
       type === 'err' ? 'bg-[#fbe9e7] text-seal border border-seal/30' : 'hidden');
    msg.textContent = text;
    msg.classList.remove('hidden');
  }

  function showStep(step) {
    if (step === 1) { step1.classList.remove('hidden'); step2.classList.add('hidden'); btn.textContent = 'Sign in'; }
    else            { step1.classList.add('hidden');    step2.classList.remove('hidden'); btn.textContent = 'Verify & sign in'; }
  }

  document.getElementById('backToPhone').addEventListener('click', function () { showStep(1); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var loginId = document.getElementById('loginId').value.trim();
    var last5   = document.getElementById('last5').value.trim();

    // Step 1: request the challenge (masked number) then switch to verification
    if (step2.classList.contains('hidden')) {
      if (!loginId) { showMsg('Please enter your phone number or email.', 'err'); return; }
      fetch(API + '/api/auth/challenge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ login_id: loginId })
      })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (r) {
        if (!r.ok) { showMsg(r.data.error || 'Could not start sign-in.', 'err'); return; }
        document.getElementById('maskedPhone').textContent = r.data.masked_phone || '';
        showStep(2);
        document.getElementById('last5').focus();
      })
      .catch(function () { showMsg('Could not reach the server. Check your connection.', 'err'); });
      return;
    }

    // Step 2: verify the last 5 digits
    if (!/^\d{5}$/.test(last5)) { showMsg('Enter exactly 5 digits — the last 5 digits of your phone number.', 'err'); return; }
    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ login_id: loginId, last5: last5 })
    })
    .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
    .then(function (r) {
      if (!r.ok) { showMsg(r.data.error || 'Sign in failed.', 'err'); return; }
      window.BusolyaAuth.login({
        id:    r.data.id,
        phone: r.data.phone,
        name:  r.data.name || loginId,
        role:  r.data.role
      });
    })
    .catch(function () {
      showMsg('Could not reach the server. Check your connection.', 'err');
    });
  });
})();
</script>
</body>
</html>
