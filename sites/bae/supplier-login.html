<!DOCTYPE html>
<html lang="en" data-site="bae">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Login — Busolya Agro Farmers Ltd</title>
<meta name="description" content="Supplier portal login — manage your products, services and demand leads.">
<link rel="icon" href="assets/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    bark:'#4a2311', cream:'#fbf6ec', paper:'#fffdf8',
    leaf:'#2f7d32', leafdark:'#1f5523', gold:'#c68a2e', seal:'#a8321e', ink:'#2a1a10'
  }, fontFamily: { display:['Georgia','Times New Roman','serif'], body:['Segoe UI','system-ui','sans-serif'] } } }
}
</script>
<style type="text/tailwindcss">
  @layer base { body { @apply bg-cream text-ink font-body antialiased; } }
</style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="mx-auto max-w-md px-5 py-12">
  <div class="rounded-2xl border border-[#e2d6c2] bg-paper p-8 shadow-lg">
    <div class="mb-7 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-[#f4e8d6]">
        <span class="text-2xl font-bold text-bark">S</span>
      </div>
      <h1 class="font-display text-2xl font-bold text-bark">Supplier portal</h1>
      <p class="mt-1 text-sm text-ink/60">Add and manage your products and services.</p>
    </div>

    <!-- Phone-as-password hint -->
    <div class="mb-4 rounded-lg border border-leaf/25 bg-[#f2f8ef] px-4 py-3 text-xs text-leafdark">
      First time? Leave the password blank — your phone number is your initial password.
      You can set a personal password any time from your portal.
    </div>

    <form id="supLoginForm" novalidate class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-semibold text-bark">Phone number or email</label>
        <input id="supLoginId" type="text" required autocomplete="username"
          class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
          placeholder="+256 700 000 000">
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold text-bark">
          Password
          <span class="ml-1 font-normal text-ink/45">(leave blank to use your phone number)</span>
        </label>
        <input id="supPassword" type="password" autocomplete="current-password"
          class="w-full rounded-lg border border-[#e2d6c2] bg-paper px-4 py-2.5 text-bark focus:border-leaf focus:outline-none focus:ring-1 focus:ring-leaf"
          placeholder="Your password or leave blank">
      </div>
      <button type="submit"
        class="w-full rounded-full bg-bark px-5 py-3 text-sm font-bold text-white hover:bg-[#3a1a0c] transition">
        Sign in to portal
      </button>
    </form>

    <div id="supMsg" class="mt-3 hidden rounded-lg px-4 py-3 text-sm"></div>

    <p class="mt-5 border-t border-[#e2d6c2] pt-4 text-center text-sm text-ink/55">
      Not yet a supplier? <a href="register.html" class="font-medium text-leafdark hover:underline">Register your business</a>
    </p>
  </div>
</main>

<div id="footer-placeholder"></div>
<script src="assets/network.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
    ? '' : 'https://busolya-api.onrender.com';

  var form = document.getElementById('supLoginForm');
  var msg  = document.getElementById('supMsg');

  function showMsg(text, type) {
    msg.className = 'mt-3 rounded-lg px-4 py-3 text-sm ' +
      (type === 'ok'  ? 'bg-[#e6efe0] text-leafdark border border-leaf/30' :
       type === 'err' ? 'bg-[#fbe9e7] text-seal border border-seal/30' : 'hidden');
    msg.textContent = text;
    msg.classList.remove('hidden');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var loginId  = document.getElementById('supLoginId').value.trim();
    var password = document.getElementById('supPassword').value;
    if (!loginId) { showMsg('Please enter your phone number or email.', 'err'); return; }

    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ login_id: loginId, password: password })
    })
    .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
    .then(function (r) {
      if (!r.ok) { showMsg(r.data.error || 'Sign in failed.', 'err'); return; }
      if (r.data.hint) showMsg(r.data.hint, 'ok');
      // Accept suppliers, members, and employees in the portal
      window.BusolyaAuth.login({ id: r.data.id, phone: r.data.phone, name: r.data.name, role: r.data.role }, 'supplier-portal.html');
    })
    .catch(function () { showMsg('Could not reach the server.', 'err'); });
  });
})();
</script>
</body>
</html>
