<!DOCTYPE html>
<html lang="en" data-site="mutindo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guarantor Portal — Abataka Mutindo SACCO</title>
  <link rel="icon" href="assets/amslogo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        maroon: '#8a2f24', maroon2: '#5e1f18', sand: '#f7efe6', paper: '#fffdfa',
        leaf: '#2f7d32', leafdark: '#1f5523', gold: '#c68a2e', ink: '#2b1a14'
      }, fontFamily: { display: ['Georgia', 'Times New Roman', 'serif'], body: ['Segoe UI', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base { body { @apply bg-sand text-ink font-body antialiased; } }
  </style>
</head>
<body>
<div id="header-placeholder"></div>
<main class="mx-auto max-w-5xl px-5 py-8">
  <div class="mb-7 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-bold text-maroon2">Guarantor Portal</h1>
      <p class="mt-1 text-sm text-ink/60">Your guarantee records — who you've guaranteed, for what, and for how long.</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="guarantorName" class="rounded-full bg-maroon/10 px-3 py-1.5 text-sm font-semibold text-maroon2"></span>
      <div class="flex items-center gap-2">
        <button onclick="shareGuarantor('wa')" class="rounded-full border border-[#e6d5c8] px-3 py-1.5 text-[.7rem] font-semibold text-maroon2 hover:bg-white/30 transition" title="Share on WhatsApp">WhatsApp</button>
        <button onclick="shareGuarantor('tg')" class="rounded-full border border-[#e6d5c8] px-3 py-1.5 text-[.7rem] font-semibold text-maroon2 hover:bg-white/30 transition" title="Share on Telegram">Telegram</button>
        <button onclick="shareGuarantor('fb')" class="rounded-full border border-[#e6d5c8] px-3 py-1.5 text-[.7rem] font-semibold text-maroon2 hover:bg-white/30 transition" title="Share on Facebook">Facebook</button>
      </div>
      <button onclick="window.BusolyaAuth&&window.BusolyaAuth.logout()" class="rounded-full border border-maroon px-4 py-2 text-sm font-bold text-maroon hover:bg-maroon hover:text-white transition">Sign out</button>
    </div>
  </div>
  <div class="mb-6 grid grid-cols-2 gap-4 md:grid-cols-4">
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Active guarantees</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statActive">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Total guaranteed (UGX)</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statTotal">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Members guaranteed</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statMembers">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Released</p><p class="mt-1 font-display text-2xl font-bold text-leaf" id="statReleased">—</p></div>
  </div>
  <section class="rounded-xl border border-[#e6d5c8] bg-paper p-6">
    <h2 class="font-display text-xl font-bold text-maroon2 mb-4">Your guarantees</h2>
    <div id="guarantorList" class="space-y-3"></div>
    <p id="noGuarantees" class="hidden text-sm text-ink/50">No guarantee records found.</p>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="assets/network.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
    ? '' : 'https://busolya-api.onrender.com';
  if (!window.BusolyaAuth || !window.BusolyaAuth.isAuthenticated()) {
    location.href = 'login.html';
    return;
  }
  var me = window.BusolyaAuth.getUser();
  var nameEl = document.getElementById('guarantorName');
  if (nameEl && me) nameEl.textContent = me.name || me.phone;
  function fmt(n) { return Number(n || 0).toLocaleString(); }
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function loadGuarantees() {
    var url = API + '/api/sacco/guarantors' + (me ? '?guarantor_id=' + me.id : '');
    fetch(url, { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = document.getElementById('guarantorList');
        var none = document.getElementById('noGuarantees');
        var guarantees = d.guarantors || [];
        if (!guarantees.length) { none.classList.remove('hidden'); return; }
        none.classList.add('hidden');
        var active = 0, released = 0, total = 0;
        var membersSet = new Set();
        list.innerHTML = guarantees.map(function (g) {
          var isActive = g.status === 'active';
          if (isActive) active++; else released++;
          total += Number(g.amount || 0);
          membersSet.add(g.member_no);
          var statusBadge = isActive
            ? '<span class="rounded-full bg-[#e6efe0] px-2 py-0.5 text-xs font-semibold text-leafdark">Active</span>'
            : '<span class="rounded-full bg-[#fbe9e7] px-2 py-0.5 text-xs font-semibold text-seal">Released</span>';
          return '<div class="border border-[#e6d5c8] rounded-xl p-4 flex flex-wrap items-start justify-between gap-3">' +
            '<div class="flex-1 min-w-0">' +
              '<p class="font-semibold text-maroon2">' + esc(g.member_name || '—') + '</p>' +
              '<p class="text-xs text-ink/55">Member ' + esc(g.member_no || '—') + ' · ' + esc(g.relationship || '—') + '</p>' +
              (g.member_phone ? '<p class="text-xs text-ink/55">Phone: ' + esc(g.member_phone) + '</p>' : '') +
            '</div>' +
            '<div class="flex gap-2 shrink-0">' +
              '<div class="text-right">' +
                '<p class="font-bold text-maroon2">UGX ' + fmt(g.amount) + '</p>' +
                '<p class="text-xs text-ink/50">' + statusBadge + '</p>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
        document.getElementById('statActive').textContent = active;
        document.getElementById('statReleased').textContent = released;
        document.getElementById('statTotal').textContent = fmt(total);
        document.getElementById('statMembers').textContent = membersSet.size;
      }).catch(function () {
        document.getElementById('noGuarantees').textContent = 'Could not load guarantees. Try again later.';
      });
  }
  function shareGuarantor(platform) {
    var name = document.getElementById('guarantorName').textContent || 'Guarantor';
    var pageUrl = location.origin + location.pathname + (me ? '?guarantor=' + me.id : '');
    var text = name + '\nSACCO Guarantor · Abataka Mutindo SACCO\n' + pageUrl;
    if (platform === 'wa') {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    } else if (platform === 'tg') {
      window.open('https://t.me/share/url?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(text), '_blank');
    } else if (platform === 'fb') {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl), '_blank');
    }
  }
  loadGuarantees();
})();
</script>
</body>
</html>
