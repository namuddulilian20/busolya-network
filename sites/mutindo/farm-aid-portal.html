<!DOCTYPE html>
<html lang="en" data-site="mutindo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm-Aid Portal — Abataka Mutindo SACCO</title>
  <link rel="icon" href="assets/amslogo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        maroon: '#8a2f24', maroon2: '#5e1f18', sand: '#f7efe6', paper: '#fffdfa',
        leaf: '#2f7d32', leafdark: '#1f5523', gold: '#c68a2e', ink: '#2b1a14'
      }, fontFamily: { display: ['Georgia', 'Times New Roman', 'serif'], body: ['Segoe UI', 'system-ui', 'sans-serif'] } } }
    }
  </script>
</head>
  <div class="mb-7 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-bold text-maroon2">Farm-Aid Portal</h1>
      <p class="mt-1 text-sm text-ink/60">Field roles, reports and education for the Farm-Aid programme.</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="farmAidName" class="rounded-full bg-maroon/10 px-3 py-1.5 text-sm font-semibold text-maroon2"></span>
      <div class="flex items-center gap-2">
        <button onclick="shareFarmAid('wa')" class="rounded-full border border-[#e6d5c8] px-3 py-1.5 text-[.7rem] font-semibold text-maroon2 hover:bg-white/30 transition" title="Share on WhatsApp">WhatsApp</button>
        <button onclick="shareFarmAid('tg')" class="rounded-full border border-[#e6d5c8] px-3 py-1.5 text-[.7rem] font-semibold text-maroon2 hover:bg-white/30 transition" title="Share on Telegram">Telegram</button>
      </div>
      <button onclick="window.BusolyaAuth&&window.BusolyaAuth.logout()" class="rounded-full border border-maroon px-4 py-2 text-sm font-bold text-maroon hover:bg-maroon hover:text-white transition">Sign out</button>
    </div>
  </div>
  <div class="mb-6 grid grid-cols-2 gap-4 md:grid-cols-4">
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Your role</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statRole">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Compartment</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statCompartment">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Location</p><p class="mt-1 font-display text-2xl font-bold text-maroon2" id="statLocation">—</p></div>
    <div class="rounded-xl border border-[#e6d5c8] bg-paper p-4"><p class="text-xs uppercase tracking-[.14em] text-ink/45">Reports filed</p><p class="mt-1 font-display text-2xl font-bold text-leaf" id="statReports">—</p></div>
  </div>
  <section class="rounded-xl border border-[#e6d5c8] bg-paper p-6 mb-6">
    <h2 class="font-display text-xl font-bold text-maroon2 mb-4">Submit a field report</h2>
    <form id="faReportForm" class="grid gap-3 sm:grid-cols-2">
      <div class="sm:col-span-2"><label class="block text-sm font-semibold text-maroon2 mb-1" for="faReportType">Report type</label><select id="faReportType" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"><option value="land_register">Land register</option><option value="transaction">Transaction</option><option value="inventory">Inventory</option><option value="payment">Payment</option><option value="dispute">Dispute</option><option value="verification">Verification</option><option value="quality">Quality</option></select></div>
      <div class="sm:col-span-2"><label class="block text-sm font-semibold text-maroon2 mb-1" for="faCompartment">Compartment</label><select id="faCompartment" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"><option value="busolya">Busolya</option><option value="butaka">Butaka</option></select></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faSsaza">Ssaza</label><input id="faSsaza" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faSsiga">Ssiga</label><input id="faSsiga" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faMutuba">Mutuba</label><input id="faMutuba" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faParish">Parish</label><input id="faParish" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faVillage">Village</label><input id="faVillage" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div><label class="block text-sm font-semibold text-maroon2 mb-1" for="faClan">Clan name</label><input id="faClan" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></div>
      <div class="sm:col-span-2"><label class="block text-sm font-semibold text-maroon2 mb-1" for="faContent">Content / notes</label><textarea id="faContent" rows="3" class="w-full rounded-lg border border-[#e6d5c8] bg-white px-3 py-2.5 text-sm focus:border-leaf focus:outline-none"></textarea></div>
      <div class="sm:col-span-2"><button type="submit" class="rounded-full bg-maroon px-6 py-3 text-sm font-bold text-white hover:bg-maroon2">Submit report</button></div>
    </form>
    <p id="faReportMsg" class="hidden mt-3 rounded-lg px-4 py-2 text-sm"></p>
  </section>
  <section class="rounded-xl border border-[#e6d5c8] bg-paper p-6">
    <h2 class="font-display text-xl font-bold text-maroon2 mb-4">Recent reports</h2>
    <div id="faReportsList" class="space-y-3"></div>
    <p id="faNoReports" class="hidden text-sm text-ink/50">No reports yet.</p>
  </section>
</main>

<body class="bg-sand text-ink font-body antialiased">
<div id="header-placeholder"></div>
<main class="mx-auto max-w-5xl px-5 py-8">
</main>
<div id="footer-placeholder"></div>
<script src="assets/network.js"></script>
<script src="../shared/components.js"></script>
<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
    ? '' : 'https://busolya-api.onrender.com';
  if (!window.BusolyaAuth || !window.BusolyaAuth.isAuthenticated()) {
    location.href = 'login.html';
    return;
  }
  var me = window.BusolyaAuth.getUser();
  var nameEl = document.getElementById('farmAidName');
  if (nameEl && me) nameEl.textContent = me.name || me.phone;
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString(); }
  function loadRoles() {
    fetch(API + '/api/farm-aid/roles', { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var roles = d.roles || [];
        var mine = me ? roles.filter(function (r) { return String(r.user_id) === String(me.id); }) : [];
        if (mine.length) {
          var r0 = mine[0];
          document.getElementById('statRole').textContent = r0.role_code;
          document.getElementById('statCompartment').textContent = r0.compartment;
          document.getElementById('statLocation').textContent = r0.location_level + ' · ' + r0.location_name;
        }
      }).catch(function () {});
  }
  function loadReports() {
    fetch(API + '/api/farm-aid/reports', { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = document.getElementById('faReportsList');
        var none = document.getElementById('faNoReports');
        var reports = d.reports || [];
        var mine = me ? reports.filter(function (r) { return String(r.reporter_id) === String(me.id); }) : [];
        if (!mine.length) { none.classList.remove('hidden'); return; }
        none.classList.add('hidden');
        document.getElementById('statReports').textContent = mine.length;
        list.innerHTML = mine.map(function (r) {
          return '<div class="border border-[#e6d5c8] rounded-xl p-4">' +
            '<p class="font-semibold text-maroon2">' + esc(r.report_type) + '</p>' +
            '<p class="text-xs text-ink/55">' + esc(r.compartment) + ' · ' + esc(r.ssaza) + ' · ' + esc(r.ssiga) + ' · ' + esc(r.mutuba) + ' · ' + esc(r.parish) + ' · ' + esc(r.village) + '</p>' +
            (r.clan_name ? '<p class="text-xs text-ink/55">Clan: ' + esc(r.clan_name) + '</p>' : '') +
            '<p class="mt-1 text-sm text-ink/70">' + esc(r.content || '') + '</p>' +
            '<p class="text-xs text-ink/40 mt-2">' + fmtDate(r.submitted_at) + ' · Status: ' + esc(r.status) + '</p>' +
            '</div>';
        }).join('');
      }).catch(function () {});
  }
  document.getElementById('faReportForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('faReportMsg');
    msg.className = 'mt-3 rounded-lg px-4 py-2 text-sm hidden';
    var body = {
      reporter_id: me ? me.id : 0,
      report_type: document.getElementById('faReportType').value,
      compartment: document.getElementById('faCompartment').value,
      ssaza: document.getElementById('faSsaza').value.trim() || undefined,
      ssiga: document.getElementById('faSsiga').value.trim() || undefined,
      mutuba: document.getElementById('faMutuba').value.trim() || undefined,
      parish: document.getElementById('faParish').value.trim() || undefined,
      village: document.getElementById('faVillage').value.trim() || undefined,
      clan_name: document.getElementById('faClan').value.trim() || undefined,
      content: document.getElementById('faContent').value.trim()
    };
    if (!body.content) { msg.textContent = 'Content is required.'; msg.classList.remove('hidden'); msg.className = 'mt-3 rounded-lg px-4 py-2 text-sm text-seal'; return; }
    fetch(API + '/api/farm-aid/reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) {
        msg.textContent = 'Report submitted.'; msg.classList.remove('hidden'); msg.className = 'mt-3 rounded-lg px-4 py-2 text-sm text-leaf';
        document.getElementById('faReportForm').reset();
        loadReports();
      } else {
        msg.textContent = d.error || 'Failed.'; msg.classList.remove('hidden'); msg.className = 'mt-3 rounded-lg px-4 py-2 text-sm text-seal';
      }
    }).catch(function () { msg.textContent = 'Server error.'; msg.classList.remove('hidden'); msg.className = 'mt-3 rounded-lg px-4 py-2 text-sm text-seal'; });
  });
  function shareFarmAid(platform) {
    var name = document.getElementById('farmAidName').textContent || 'Farm-Aid';
    var pageUrl = location.origin + location.pathname + (me ? '?farmer=' + me.id : '');
    var text = name + '\nFarm-Aid Field Report · Abataka Mutindo SACCO\n' + pageUrl;
    if (platform === 'wa') {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    } else {
      window.open('https://t.me/share/url?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(text), '_blank');
    }
  }
  loadRoles();
  loadReports();
})();
</script>
</body>
</html>
